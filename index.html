<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foršais Gailis</title>
    <script src="favicon.js"></script>
    <style>
      @font-face {
        font-family: "Nunito";
        src: url("assets/fonts/Nunito-SemiBold.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Staatliches";
        src: url("assets/fonts/Staatliches-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        background: #fff;
        color: #111;
        font-family: "Nunito", system-ui, sans-serif;
        font-weight: 600;
      }

      main {
        max-width: 44rem;
        margin: 0 auto;
        padding: 2.5rem 1.25rem 3.5rem;
        text-align: center;
      }

      .logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
        margin: 0 0 2rem;
      }

      .logo-word {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35rem;
      }

      .logo-letter {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 4.25rem;
        height: 4.25rem;
        cursor: pointer;
      }

      .logo-letter img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity 0.18s ease;
      }

      .logo-letter .glyph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        color: #111;
        font-family: "Staatliches", sans-serif;
        font-size: 2.9rem;
        font-weight: 400;
        line-height: 1;
        letter-spacing: 0;
        transition: opacity 0.18s ease;
        pointer-events: none;
      }

      .logo-letter:hover img,
      .logo-letter:focus-visible img,
      .logo-letter.is-open img {
        opacity: 0;
      }

      .logo-letter:hover .glyph,
      .logo-letter:focus-visible .glyph,
      .logo-letter.is-open .glyph {
        opacity: 1;
      }

      .logo-letter:focus-visible {
        outline: 2px solid #111;
        outline-offset: 3px;
        border-radius: 0.35rem;
      }

      h1.visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      p {
        color: #333;
        line-height: 1.5;
      }

      .buy {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0.25rem 0 1.75rem;
        padding: 0.75rem 1.4rem;
        color: #fff;
        background: #111;
        text-decoration: none;
        border-radius: 0.5rem;
        font-size: 1.05rem;
      }

      .buy:hover,
      .buy:focus-visible {
        background: #333;
        outline: none;
      }

      ol {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(4rem, 1fr));
        gap: 4rem;
        padding: 0;
        list-style: none;
      }

      a.page-link {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        min-width: 7rem;
        color: #111;
        text-decoration: none;
        border: 1px solid #ccc;
        border-radius: 0.4rem;
      }

      a.page-link:hover,
      a.page-link:focus-visible {
        border-color: #111;
        outline: none;
      }

      @media (max-width: 640px) {
        .logo-letter {
          width: 3.15rem;
          height: 3.15rem;
        }

        .logo-letter .glyph {
          font-size: 2.5rem;
        }
      }
    </style>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".logo-letter").forEach(function (el) {
          el.addEventListener("click", function () {
            var wasOpen = el.classList.contains("is-open");
            document.querySelectorAll(".logo-letter.is-open").forEach(function (openEl) {
              openEl.classList.remove("is-open");
            });
            if (!wasOpen) el.classList.add("is-open");
          });
        });
      });
    </script>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Foršais Gailis</h1>
      <div class="logo" aria-hidden="true">
        <div class="logo-word">

          <span class="logo-letter"><img src="assets/signs/S.png" alt=""><span class="glyph">S</span></span>
        </div>
        <div class="logo-word">
          <span class="logo-letter"><img src="assets/signs/G.png" alt=""><span class="glyph">G</span></span>
          <span class="logo-letter"><img src="assets/signs/A.png" alt=""><span class="glyph">A</span></span>
          <span class="logo-letter"><img src="assets/signs/I.png" alt=""><span class="glyph">I</span></span>

          <span class="logo-letter"><img src="assets/signs/I.png" alt=""><span class="glyph">I</span></span>
          <span class="logo-letter"><img src="assets/signs/S.png" alt=""><span class="glyph">S</span></span>
        </div>
      </div>
      <a class="buy" href="https://drosikosi.com/">Pirkt grāmatu</a>
